[project]
name = "ai-stack-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "datasets>=5.1.0",
    "fastapi>=0.143.0",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "mcp[cli]>=1.30.0",
    "sentencepiece>=0.2.2",
    "torch>=2.14.1",
    "transformers>=5.19.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-stack-lab = "ai_stack_lab:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
